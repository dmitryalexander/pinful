name: ${COMPOSE_PROJECT_NAME:-pinful}
services:
  pinful:
    image: ${COMPOSE_PROJECT_NAME:-pinful}:local
    build: ${PINFUL_SOURCE:-.}
    ports: ["127.0.0.1:${PINFUL_PORT:-3001}:3000"]
    environment:
      PINLESS_DATA: /data
    volumes: [pinful-data:/data]
    restart: unless-stopped
volumes:
  pinful-data:
    external: ${PINFUL_EXTERNAL_DATA:-false}
    name: ${PINFUL_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-pinful}_data}
